; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   flight  — production flight firmware   (pio run -e flight -t upload)
;   bench   — hardware bench test harness  (pio run -e bench  -t upload)
;   finned  — minimal no-TVC recovery-only firmware (pio run -e finned -t upload)
;   flight_sim — flight firmware with simulated sensors, for bench-testing detection
;               (pio run -e flight_sim -t upload)
;   servo_cal — nozzle travel-limit finder, used by src/find_servo_limits.py
;               (pio run -e servo_cal -t upload)

[platformio]
default_envs = flight

[common]
platform      = teensy
board         = teensy40
framework     = arduino
monitor_speed = 115200
; monitor_port  = COM3        ; Windows — change to your port
; monitor_port = /dev/ttyACM0       ; Linux
; monitor_port = /dev/cu.usbmodem*  ; Mac
extra_scripts = pre:extra_scripts/cxx_warnings.py
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -I include

; ── Production flight firmware ─────────────────────────────────────────────
[env:flight]
extends = common
build_src_filter = +<*> -<main.cpp> -<bench_test.cpp> -<test_alt_estimator.cpp> -<finned_control_loop.cpp> -<servo_limit_finder.cpp>
lib_deps = https://github.com/tonton81/WDT_T4.git

; ── Bench simulation of the flight firmware ─────────────────────────────────
; The real flight code with simulated sensors: src/sim_hil.cpp replaces the
; IMU, baro and magnetometer drivers and flies a simulated rocket through the
; scenario picked over serial, then grades launch / burnout / apogee / main /
; landing detection. Pyro outputs are never driven; servos move.
; Bench use only — never fly this build.   (pio run -e flight_sim -t upload)
[env:flight_sim]
extends = env:flight
build_flags = ${common.build_flags} -D SIM_MODE
build_src_filter = ${env:flight.build_src_filter} -<lsm6dsox.cpp> -<lps22hb.cpp> -<mag.cpp> -<mag_calib.cpp>

; ── Hardware bench test harness ────────────────────────────────────────────
[env:bench]
extends = common
build_src_filter = +<*> -<main.cpp> -<main_control_loop.cpp> -<test_alt_estimator.cpp> -<finned_control_loop.cpp> -<servo_limit_finder.cpp>

; ── Finned (no-TVC) recovery-only firmware ──────────────────────────────────
; No arm/disarm, no continuity gate, no PID/servo — see include/simple_fsm.h.
[env:finned]
extends = common
build_src_filter = +<*> -<main.cpp> -<main_control_loop.cpp> -<bench_test.cpp> -<test_alt_estimator.cpp> -<flight_sm.cpp> -<servo_limit_finder.cpp>
lib_deps = https://github.com/tonton81/WDT_T4.git

; ── Nozzle travel-limit finder ──────────────────────────────────────────────
; Raw-pulse jog firmware driven by src/find_servo_limits.py. Ignores the
; MIN_US/MAX_US stops in servo_driver.h so the real ones can be found.
; Bench use only — never fly this build.
[env:servo_cal]
extends = common
build_src_filter = -<*> +<servo_limit_finder.cpp>
