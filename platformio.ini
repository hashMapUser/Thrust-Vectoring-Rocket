; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environments:
;   flight  — production flight firmware   (pio run -e flight -t upload)
;   bench   — hardware bench test harness  (pio run -e bench  -t upload)
;   finned  — minimal no-TVC recovery-only firmware (pio run -e finned -t upload)

[platformio]
default_envs = flight

[common]
platform      = teensy
board         = teensy40
framework     = arduino
monitor_speed = 115200
; monitor_port  = COM3        ; Windows — change to your port
; monitor_port = /dev/ttyACM0       ; Linux
; monitor_port = /dev/cu.usbmodem*  ; Mac
extra_scripts = pre:extra_scripts/cxx_warnings.py
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -I include

; ── Production flight firmware ─────────────────────────────────────────────
[env:flight]
extends = common
build_src_filter = +<*> -<main.cpp> -<bench_test.cpp> -<test_alt_estimator.cpp> -<finned_control_loop.cpp>
lib_deps = https://github.com/tonton81/WDT_T4.git

; ── Hardware bench test harness ────────────────────────────────────────────
[env:bench]
extends = common
build_src_filter = +<*> -<main.cpp> -<main_control_loop.cpp> -<test_alt_estimator.cpp> -<finned_control_loop.cpp>

; ── Finned (no-TVC) recovery-only firmware ──────────────────────────────────
; No arm/disarm, no continuity gate, no PID/servo — see include/simple_fsm.h.
[env:finned]
extends = common
build_src_filter = +<*> -<main.cpp> -<main_control_loop.cpp> -<bench_test.cpp> -<test_alt_estimator.cpp> -<flight_sm.cpp>
lib_deps = https://github.com/tonton81/WDT_T4.git
